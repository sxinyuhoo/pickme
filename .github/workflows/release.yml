name: Release Obsidian plugin

# 打 tag 即发版：tag 必须与 manifest.json 里的 version 一致（例如 1.0.0）。
# 三个产物作为 release 附件上传，Obsidian / BRAT 安装时就是从这里取的。
on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Check generated assets are committed and up to date
        run: |
          # 生成文件是提交进仓库的（扫描器要能解析它，否则会出 unsafe-* 假阳性）。
          # npm run build 已经重新生成过一次，这里守住它没有跟 pdfjs-dist 漂移。
          if ! git diff --exit-code -- src/generated; then
            echo "src/generated 与仓库里的版本不一致：本地跑 npm run assets 后一并提交" >&2
            exit 1
          fi

      - name: Check versions match
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "tag ($tag) 与 manifest.json 的 version ($manifest) 不一致" >&2
            exit 1
          fi

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Collect release notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # 从 CHANGELOG.md 里抽出版本小节（## <tag> 到下一个 ## 之前）；抽不到就退回一句通用说明。
          # 官方审查会看 release 有没有说明，所以这一节不能为空。
          awk -v tag="$tag" 'index($0, "## " tag) == 1 {flag=1; next} flag && /^## / {exit} flag {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Fixes and small improvements in %s.\n' "$tag" > release-notes.md
          fi
          echo '--- release notes ---'
          cat release-notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css
